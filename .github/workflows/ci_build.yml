name: Build Status

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
    - name: Install dependencies
      run: npm ci
      env:
        DEFAULT_BRANCH: master
    - run: npm test
      env:
        DEFAULT_BRANCH: master
